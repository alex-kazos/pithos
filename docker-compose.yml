# `docker compose up -d` runs the whole app: Postgres + Pithos on
# http://localhost:3000. Settings come from .env (copy .env.example).
#
# For local development run only the database (`npm run db:up`) and start
# the app with `npm run dev`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pithos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pithos}
      POSTGRES_DB: pithos
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Published on localhost only, for `npm run dev`.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pithos -d pithos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside Compose the database is reachable as "db", not localhost.
      DATABASE_URL: postgres://pithos:${POSTGRES_PASSWORD:-pithos}@db:5432/pithos
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  db-data:
