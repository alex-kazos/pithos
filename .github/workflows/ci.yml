name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (blocking)
    runs-on: ubuntu-latest
    services:
      # Real Postgres for server/integration.test.ts (skipped without TEST_DATABASE_URL).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pithos
          POSTGRES_PASSWORD: pithos
          POSTGRES_DB: pithos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pithos -d pithos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real MySQL and MariaDB for the own-database connector
      # (server/lib/customDatabase.mysql.test.ts, skipped without the URLs).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pithos
          MYSQL_DATABASE: pithos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppithos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: pithos
          MARIADB_DATABASE: pithos_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://pithos:pithos@localhost:5432/pithos_test
      TEST_MYSQL_URL: mysql://root:pithos@127.0.0.1:3306/pithos_test?ssl-mode=REQUIRED
      TEST_MARIADB_URL: mariadb://root:pithos@127.0.0.1:3307/pithos_test?ssl-mode=DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck-server:
    name: Typecheck server (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:server

  build:
    name: Build frontend and server (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npm run build:server

  docker:
    name: Docker image builds (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pithos:ci .

  lint:
    name: Lint (informational - repo has pre-existing debt)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck-app:
    name: Typecheck frontend (informational - repo has pre-existing debt)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
